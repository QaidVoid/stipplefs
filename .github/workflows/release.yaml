name: stipplefs release

# Called by release-plz once it has published a release. A release created
# with GITHUB_TOKEN triggers no other workflow, so `on: release` would never
# fire. Run it by hand to attach binaries to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the binaries to
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: x86_64-linux,
              RUNNER: ubuntu-latest,
              TARGET: x86_64-unknown-linux-musl,
            }
          - {
              NAME: aarch64-linux,
              RUNNER: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-musl,
            }
          - {
              NAME: i686-linux,
              RUNNER: ubuntu-latest,
              TARGET: i686-unknown-linux-musl,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools b3sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: ${{ matrix.build.TARGET }}

      # There is no apt i686 musl gcc and no native i686 runner, so fetch a
      # prebuilt i686 musl cross toolchain for zstd's C code and the link.
      - name: Install i686 musl toolchain
        if: matrix.build.TARGET == 'i686-unknown-linux-musl'
        run: |
          url="https://toolchains.bootlin.com/downloads/releases/toolchains/x86-i686/tarballs/x86-i686--musl--stable-2024.05-1.tar.xz"
          mkdir -p "$HOME/i686-toolchain"
          curl -fsSL "$url" | tar -xJ -C "$HOME/i686-toolchain" --strip-components=1
          echo "$HOME/i686-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          CC_i686_unknown_linux_musl: i686-linux-gcc
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: i686-linux-gcc
        run: >-
          cargo build --release --locked --target ${{ matrix.build.TARGET }}
          --features cli,mount,zstd,dict,mmap

      - name: Create release artifacts
        shell: bash
        run: |
          name=${{ matrix.build.NAME }}
          bin="target/${{ matrix.build.TARGET }}/release"
          mkdir -p release
          cp LICENSE-APACHE LICENSE-MIT README.md "$bin/stipple" "$bin/mkstipple" release/
          for tool in stipple mkstipple; do
            cp "$bin/$tool" "$tool-$name"
            b3sum "$tool-$name" > "$tool-$name.b3sum"
          done
          tar -cJvf "stipplefs-$name.tar.xz" release/
          b3sum "stipplefs-$name.tar.xz" > "stipplefs-$name.tar.xz.b3sum"

      - name: Upload to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*-${{ matrix.build.NAME }}*"
          file_glob: true
          overwrite: true
          tag: ${{ inputs.tag }}

      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*-${{ matrix.build.NAME }}*"
