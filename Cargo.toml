[package]
name = "stipplefs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive"], optional = true }
memmap2 = { version = "0.9.11", optional = true }
twox-hash = { version = "2.1.4", default-features = false, optional = true }
zstd = { version = "0.14.0", default-features = false, optional = true }

[features]
default = ["read", "write", "fs"]
read = ["dep:twox-hash", "twox-hash/xxhash3_64"]
write = ["dep:twox-hash", "twox-hash/xxhash3_64", "twox-hash/xxhash3_128"]
cli = ["dep:clap", "fs"]
fs = []
mount = ["read"]
mmap = ["dep:memmap2", "fs", "read"]
zstd = ["dep:zstd"]
dict = ["zstd", "zstd/zdict_builder"]

[[bin]]
name = "stipple"
required-features = ["read", "cli"]

[[bin]]
name = "mkstipple"
required-features = ["write", "cli"]

[dev-dependencies]
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash3_64"] }
